[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM3
monitor_port = COM3
board_upload.wait_for_upload_port = true
lib_deps =
  https://github.com/tzapu/WiFiManager.git
  marian-craciunescu/ESP32Ping @ ^1.7
  bblanchon/ArduinoJson @ ^7.3.0
build_flags =
  -DWM_NODEBUG
  -I include
